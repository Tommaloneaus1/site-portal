<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>111 Bourke Ground Floor — Lookahead (View Only)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f4f5f6;color:#1a1e24;font-family:'IBM Plex Sans',sans-serif;min-height:100vh;}
.hdr{background:#ffffff;border-bottom:2px solid #F96302;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.hdr h1{font-size:16px;font-weight:700;color:#1a1e24;}
.hdr .sub{font-size:11px;color:#5a6270;}
.badge{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:#5a6270;flex-wrap:wrap;}
.badge b{color:#1a1e24;}
.viewonly{background:rgba(249,99,2,.1);border:1px solid rgba(249,99,2,.3);color:#c2410c;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.3px;}
button{font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border:none;}
button.refresh{background:#F96302;color:#fff;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:700;}
button.refresh:disabled{opacity:.5;cursor:default;}
button.dl{background:#ffffff;border:1px solid #c8cdd3;color:#1a1e24;padding:7px 12px;border-radius:4px;font-size:12px;font-weight:600;}
button.dl:hover{background:#f7f8f9;}
.wrap{padding:18px 20px;max-width:1500px;margin:0 auto;}
.tabBar{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid #dde0e3;}
.tabBtn{background:transparent;color:#5a6270;padding:9px 16px;font-size:13px;font-weight:600;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabBtn.active{color:#F96302;border-bottom-color:#F96302;}
.filterbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filterbar input[type=text]{flex:1;min-width:200px;background:#fff;border:1px solid #c8cdd3;border-radius:4px;padding:8px 12px;color:#1a1e24;font-size:13px;}
.tradechip{padding:5px 11px;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #c8cdd3;background:#fff;color:#5a6270;white-space:nowrap;}
.tradechip.active{color:#fff;}
.panel{background:#fff;border:1px solid #dde0e3;border-radius:6px;overflow:hidden;}
.panel h2{font-size:11px;font-weight:700;color:#5a6270;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;border-bottom:1px solid #dde0e3;}
.ganttScrollX{overflow-x:auto;}
table.ga{border-collapse:collapse;font-size:10px;}
.stickyName{position:sticky;left:0;z-index:2;}
.stickyPct{position:sticky;left:170px;z-index:2;}
.mobileList{display:none;}
.mCard{border-bottom:1px solid #eef0f2;padding:11px 14px 11px 18px;position:relative;overflow:hidden;}
.mCard:last-child{border-bottom:none;}
.mGroupHdr{background:#fafbfb;padding:9px 14px;font-size:11px;font-weight:700;color:#1a1e24;border-bottom:1px solid #dde0e3;display:flex;align-items:center;gap:7px;}
.mName{font-size:13px;font-weight:600;color:#1a1e24;margin-bottom:3px;}
.mMeta{font-size:11px;color:#5a6270;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.mZone{color:#8a9099;}
.mPctBar{background:#eef0f2;border-radius:3px;height:5px;margin-top:6px;overflow:hidden;}
.mPctFill{height:100%;border-radius:3px;}
.mPctNum{font-weight:700;flex-shrink:0;}
.todayGrid{display:flex;flex-direction:column;}
.heatWrap{border-top:1px solid #dde0e3;}
.heatHdr{font-size:11px;font-weight:700;color:#5a6270;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;border-bottom:1px solid #dde0e3;background:#fafbfb;}
#heatCanvasWrap{position:relative;background:#0d0f11;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#heatCanvas{width:100%;height:auto;display:block;}
@media (min-width:1000px){
  .todayGrid{flex-direction:row;}
  #todayWrap{flex:1.1;max-height:640px;overflow-y:auto;}
  .heatWrap{flex:1;border-top:none;border-left:1px solid #dde0e3;}
  #heatCanvasWrap{min-height:100%;height:640px;}
}
.viewToggle{display:flex;border:1px solid #c8cdd3;border-radius:4px;overflow:hidden;}
.viewToggle button{background:#fff;color:#5a6270;padding:6px 10px;font-size:11px;font-weight:600;border:none;}
.viewToggle button.active{background:#1a1e24;color:#fff;}
.viewToggle button:first-child{border-right:1px solid #c8cdd3;}
body.mode-phone .ganttScrollX{display:none;}
body.mode-phone .mobileList{display:block;}
body.mode-desktop .ganttScrollX{display:block;}
body.mode-desktop .mobileList{display:none;}
@media (max-width:700px){
  .wrap{padding:12px;}
  .hdr{padding:12px;}
  .hdr h1{font-size:14px;}
  .badge{font-size:10px;gap:6px;}
  button.refresh{padding:6px 10px;font-size:11px;}
  button.dl{padding:6px 9px;font-size:11px;}
}
@media print{ .filterbar,.refresh,.dl,.badge,.viewToggle,.hdr,.tabBar{display:none !important;} body{background:#fff;} body.mode-phone .ganttScrollX{display:block !important;} body.mode-phone .mobileList{display:none !important;} #printLetterhead{display:block !important;} #panelProgramme{display:block !important;} #panelToday{display:none !important;} }
#printLetterhead{border-bottom:2px solid #1a1e24;padding-bottom:12px;margin-bottom:16px;}
#printLetterhead .plTitle{font-size:20px;font-weight:800;color:#1a1e24;}
#printLetterhead .plSub{font-size:12px;color:#5a6270;margin-top:2px;}
#printLetterhead .plMeta{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:#5a6270;}
.empty{padding:40px 20px;text-align:center;color:#8a9099;font-size:13px;}
.err{padding:40px 20px;text-align:center;color:#b45309;font-size:13px;}
.loading{padding:40px 20px;text-align:center;color:#5a6270;font-size:13px;}
.msDiamond{width:9px;height:9px;background:#F96302;transform:rotate(45deg);display:inline-block;flex-shrink:0;}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h1 id="hdrName">111 Bourke Ground Floor</h1>
    <div class="sub">Programme Lookahead — Whole Project</div>
  </div>
  <span class="viewonly">VIEW ONLY</span>
  <div class="badge">
    <span id="lastUpdated">Loading…</span>
    <div class="viewToggle">
      <button id="btnDesktop" onclick="setViewMode('desktop')">🖥 Desktop</button>
      <button id="btnPhone" onclick="setViewMode('phone')">📱 Phone</button>
    </div>
    <button class="dl" onclick="downloadCSV()">⬇ CSV</button>
    <button class="dl" onclick="downloadLookaheadPDF()">🖶 PDF</button>
    <button class="refresh" id="refreshBtn" onclick="loadPortal()">↻ Refresh</button>
  </div>
</div>
<div class="wrap">
  <div class="tabBar">
    <button id="tabProgramme" class="tabBtn active" onclick="setActiveTab('programme')">Programme</button>
    <button id="tabToday" class="tabBtn" onclick="setActiveTab('today')">📅 Today</button>
  </div>
  <div class="filterbar">
    <input type="text" id="searchInp" placeholder="Search tasks…" oninput="onFilterChange()">
    <div id="tradeChips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>
  <div id="printLetterhead" style="display:none;"></div>
  <div class="panel" id="panelProgramme">
    <h2>Programme — Whole Project Lookahead</h2>
    <div class="ganttScrollX"><div id="taskTableWrap"><div class="loading">Loading programme…</div></div></div>
    <div class="mobileList" id="mobileListWrap"></div>
  </div>
  <div class="panel" id="panelToday" style="display:none;">
    <h2 id="todayHdr">On Site Today</h2>
    <div class="todayGrid">
      <div id="todayWrap"><div class="loading">Loading…</div></div>
      <div class="heatWrap">
        <div class="heatHdr">Where Work Is Today</div>
        <div id="heatCanvasWrap"><div class="loading">Loading…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
// Default the view mode to whatever suits the actual screen, but the
// person can always override with the toggle — it's remembered for next
// time via localStorage so it doesn't reset on every refresh.
function setViewMode(mode){
  document.body.classList.remove('mode-desktop','mode-phone');
  document.body.classList.add('mode-'+mode);
  document.getElementById('btnDesktop').classList.toggle('active', mode==='desktop');
  document.getElementById('btnPhone').classList.toggle('active', mode==='phone');
  try{ localStorage.setItem('bridgePortalViewMode', mode); }catch(e){}
}
(function initViewMode(){
  let mode;
  try{ mode = localStorage.getItem('bridgePortalViewMode'); }catch(e){}
  if(!mode) mode = window.innerWidth <= 700 ? 'phone' : 'desktop';
  setViewMode(mode);
})();

// Reads ?gist=ID from the URL first — this is what lets ONE hosted copy of
// this page serve every project. If you open the file directly (no query
// string, e.g. double-clicking it), it falls back to the ID baked in at
// download time so it still works standalone with no hosting at all.
const GIST_ID = new URLSearchParams(location.search).get('gist') || "21ff87027186fa5075661971b1cf74bd";
let DATA = null;
let activeTradeFilter = null;
let activeTab = 'programme';

async function loadPortal(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = 'Loading…';
  try {
    const r = await fetch('https://api.github.com/gists/' + GIST_ID, {
      headers: { 'X-GitHub-Api-Version': '2022-11-28' }
    });
    if(!r.ok) throw new Error(r.status === 404 ? 'Portal not found — the link may be wrong or no longer active' : ('GitHub error ' + r.status));
    const gistData = await r.json();
    const files = Object.values(gistData.files || {});
    const f = files.find(f => f.filename === 'portal.bridge') || files.find(f => f.filename.endsWith('.bridge')) || files[0];
    if(!f) throw new Error('No programme data found in this portal');
    const raw = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    DATA = JSON.parse(raw);
    document.getElementById('hdrName').textContent = DATA.name || '111 Bourke Ground Floor';
    document.title = (DATA.name || '111 Bourke Ground Floor') + ' — Lookahead (View Only)';
    const ts = DATA._portalUpdatedAt ? new Date(DATA._portalUpdatedAt) : new Date();
    document.getElementById('lastUpdated').innerHTML = 'Last updated: <b>' + ts.toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) + '</b>';
    renderTradeChips();
    renderTasks();
    renderToday();
  } catch(err) {
    document.getElementById('taskTableWrap').innerHTML = '<div class="err">⚠ ' + err.message + '</div>';
    document.getElementById('todayWrap').innerHTML = '<div class="err">⚠ ' + err.message + '</div>';
    document.getElementById('lastUpdated').textContent = 'Failed to load';
  }
  btn.disabled = false; btn.textContent = '↻ Refresh';
}

function tradeById(id){ return (DATA.TRADES||[]).find(t => t.id === id) || {label:id, dot:'#888'}; }
function diffDays(a,b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000); }
function isoK(d){ return d.toISOString().slice(0,10); }
function pd(s){ return new Date(s+'T12:00:00'); }

function renderTradeChips(){
  const wrap = document.getElementById('tradeChips');
  const trades = DATA.TRADES || [];
  const viewAllChip = '<span class="tradechip' + (activeTradeFilter===null?' active':'') + '" style="' +
    (activeTradeFilter===null ? 'background:#1a1e24;border-color:#1a1e24;' : '') +
    '" onclick="setTradeFilter(null)">View All</span>';
  const tradeChips = trades.map(t =>
    '<span class="tradechip' + (activeTradeFilter===t.id?' active':'') + '" style="' +
    (activeTradeFilter===t.id ? 'background:'+t.dot+';border-color:'+t.dot+';' : '') +
    '" onclick=\'toggleTradeFilter(' + JSON.stringify(t.id) + ')\'>' +
    '<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:' + t.dot + ';margin-right:5px;"></span>' + t.label + '</span>'
  ).join('');
  wrap.innerHTML = viewAllChip + tradeChips;
}

function setTradeFilter(id){
  activeTradeFilter = id;
  renderTradeChips();
  onFilterChange();
}

function toggleTradeFilter(id){
  activeTradeFilter = activeTradeFilter === id ? null : id;
  renderTradeChips();
  onFilterChange();
}

// Search/trade filter apply to whichever tab is currently open.
function onFilterChange(){
  if(activeTab === 'today') renderToday();
  else renderTasks();
}

function setActiveTab(tab){
  activeTab = tab;
  document.getElementById('tabProgramme').classList.toggle('active', tab==='programme');
  document.getElementById('tabToday').classList.toggle('active', tab==='today');
  document.getElementById('panelProgramme').style.display = tab==='programme' ? '' : 'none';
  document.getElementById('panelToday').style.display = tab==='today' ? '' : 'none';
  if(DATA) onFilterChange();
}

// Today view — a simple grouped card list (same shape on desktop or phone,
// since there's no date range to lay out, just what's active right now).
function renderToday(){
  if(!DATA) return;
  const today = isoK(new Date());
  const hdr = document.getElementById('todayHdr');
  if(hdr) hdr.textContent = 'On Site Today — ' + new Date().toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'});

  const search = (document.getElementById('searchInp').value || '').toLowerCase();
  let onSite = (DATA.tasks || []).filter(t => t.startDate && t.endDate && t.startDate <= today && t.endDate >= today);
  if(activeTradeFilter) onSite = onSite.filter(t => t.trade === activeTradeFilter);
  if(search) onSite = onSite.filter(t => (t.name||'').toLowerCase().includes(search) || (t.zone||'').toLowerCase().includes(search));

  const wrap = document.getElementById('todayWrap');
  if(!onSite.length){
    wrap.innerHTML = '<div class="empty">Nothing on site today' + (activeTradeFilter||search?' matching this filter':'') + '</div>';
    renderTodayHeatmap([]);
    return;
  }

  const trades = (DATA.TRADES||[]).filter(tr => onSite.some(t => t.trade === tr.id));
  let html = '<div class="mobileList" style="display:block;">';
  trades.forEach(tr => {
    const tlist = onSite.filter(t => t.trade === tr.id).sort((a,b) => (a.name||'').localeCompare(b.name||''));
    html += '<div class="mGroupHdr"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + tr.dot + ';"></span>' + tr.label + ' <span style="margin-left:auto;color:#8a9099;font-weight:600;">' + tlist.length + '</span></div>';
    tlist.forEach(t => {
      if(t.milestone){
        html += '<div class="mCard"><div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:#F96302;"></div>' +
          '<div class="mName"><span class="msDiamond" style="margin-right:6px;vertical-align:middle;"></span>' + escapeHtml(t.name) + '</div>' +
          '<div class="mMeta"><span>Milestone today</span></div></div>';
        return;
      }
      const pct = t.pct||0;
      html += '<div class="mCard"><div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:' + tr.dot + ';"></div>' +
        '<div class="mName">' + escapeHtml(t.name) + (t.zone?' <span class="mZone">(' + escapeHtml(t.zone) + ')</span>':'') + '</div>' +
        '<div class="mMeta"><span>' + t.startDate + ' → ' + t.endDate + '</span><span class="mPctNum" style="color:' + tr.dot + ';">' + pct + '%</span></div>' +
        '<div class="mPctBar"><div class="mPctFill" style="width:' + pct + '%;background:' + tr.dot + ';"></div></div></div>';
    });
  });
  html += '</div>';
  wrap.innerHTML = html;
  renderTodayHeatmap(onSite);
}

// Heat map — the GA drawing with today's active work zones highlighted by
// trade colour, same idea as Bridge's own Daily Dashboard map view.
let _heatCachedImg = null, _heatCachedSrc = null;
function renderTodayHeatmap(onSiteTasks){
  const heatWrap = document.getElementById('heatCanvasWrap');
  if(!heatWrap) return;
  const drawing = DATA.gaPDF || (DATA.gaPDFs && Object.values(DATA.gaPDFs)[0]);
  if(!drawing){
    heatWrap.innerHTML = '<div class="empty" style="color:#9aa2ad;">No GA drawing shared for this project</div>';
    return;
  }
  if(!heatWrap.querySelector('canvas')) heatWrap.innerHTML = '<canvas id="heatCanvas"></canvas>';
  const canvas = document.getElementById('heatCanvas');
  const ctx = canvas.getContext('2d');

  function draw(img){
    canvas.width = img.width; canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    onSiteTasks.forEach(t => {
      const tr = tradeById(t.trade);
      (t.workZones || []).forEach(area => {
        const pts = (area.points || []).map(([nx,ny]) => [nx*img.width, ny*img.height]);
        if(pts.length < 2) return;
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
        ctx.closePath();
        ctx.fillStyle = tr.dot + '55'; ctx.fill();
        ctx.strokeStyle = tr.dot; ctx.lineWidth = Math.max(1.5, img.width/400); ctx.stroke();
        const cx = pts.reduce((s,p)=>s+p[0],0)/pts.length, cy = pts.reduce((s,p)=>s+p[1],0)/pts.length;
        const fs = Math.max(11, img.width/90);
        ctx.font = '700 ' + fs + 'px IBM Plex Sans, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const label = t.name.length > 20 ? t.name.slice(0,18)+'…' : t.name;
        const tw = ctx.measureText(label).width, pad = 6, ph = fs+8;
        ctx.fillStyle = tr.dot + 'e6';
        if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(cx-tw/2-pad, cy-ph/2, tw+pad*2, ph, 4); ctx.fill(); }
        else ctx.fillRect(cx-tw/2-pad, cy-ph/2, tw+pad*2, ph);
        ctx.fillStyle = '#fff'; ctx.fillText(label, cx, cy);
      });
    });
  }

  if(_heatCachedSrc === drawing && _heatCachedImg){
    draw(_heatCachedImg);
  } else {
    const img = new Image();
    img.onload = () => { _heatCachedImg = img; _heatCachedSrc = drawing; draw(img); };
    img.onerror = () => { heatWrap.innerHTML = '<div class="err">Drawing failed to load</div>'; };
    img.src = drawing;
  }
}

function allTasksForRange(){
  return (DATA.tasks || []).filter(t => t.startDate && t.endDate);
}

function currentFilteredTasks(){
  const search = (document.getElementById('searchInp').value || '').toLowerCase();
  let tasks = allTasksForRange();
  if(activeTradeFilter) tasks = tasks.filter(t => t.trade === activeTradeFilter);
  if(search) tasks = tasks.filter(t => (t.name||'').toLowerCase().includes(search) || (t.zone||'').toLowerCase().includes(search));
  return tasks;
}

function renderTasks(){
  if(!DATA) return;
  const allTasks = allTasksForRange();
  const wrap = document.getElementById('taskTableWrap');
  const mWrapEarly = document.getElementById('mobileListWrap');
  if(!allTasks.length){ wrap.innerHTML = '<div class="empty">No tasks in this programme</div>'; if(mWrapEarly) mWrapEarly.innerHTML = '<div class="empty">No tasks in this programme</div>'; return; }

  // Whole-project day range — fixed regardless of filter, so the timeline
  // never shifts as you search or toggle trades, only which rows show.
  const starts = allTasks.map(t => t.startDate).sort();
  const ends = allTasks.map(t => t.endDate).sort();
  const rangeStart = starts[0], rangeEnd = ends[ends.length-1];
  const rangeStartD = pd(rangeStart);
  const totalDays = Math.max(1, diffDays(rangeStart, rangeEnd) + 1);
  const today = isoK(new Date());

  const gCols = [];
  for(let i=0;i<totalDays;i++){ const d=new Date(rangeStartD); d.setDate(d.getDate()+i); gCols.push(isoK(d)); }

  const filtered = currentFilteredTasks();
  if(!filtered.length){ wrap.innerHTML = '<div class="empty">No tasks match</div>'; if(mWrapEarly) mWrapEarly.innerHTML = '<div class="empty">No tasks match</div>'; return; }

  const trades = (DATA.TRADES||[]).filter(tr => filtered.some(t => t.trade === tr.id));

  let head = '<tr><td class="stickyName" style="width:170px;border:1px solid #dde0e3;background:#f7f8f9;"></td><td class="stickyPct" style="width:40px;border:1px solid #dde0e3;background:#f7f8f9;"></td>';
  gCols.forEach(d => {
    const D = pd(d), isT = d===today, dow = D.getDay(), isSat = dow===6;
    head += '<td style="text-align:center;border:1px solid #dde0e3;font-size:8px;padding:3px 2px;min-width:18px;color:' + (isT?'#F96302':isSat?'#b45309':'#5a6270') + ';background:' + (isT?'rgba(249,99,2,.06)':isSat?'rgba(180,83,9,.04)':'#fff') + ';font-weight:' + (isT?'700':'400') + ';">' + D.getDate() + '</td>';
  });
  head += '</tr>';

  let body = '';
  trades.forEach(tr => {
    const tlist = filtered.filter(t => t.trade === tr.id).sort((a,b) => (a.startDate||'').localeCompare(b.startDate||''));
    body += '<tr><td class="stickyName" colspan="2" style="width:210px;background:#fff;border:1px solid #dde0e3;border-left:4px solid ' + tr.dot + ';padding:5px 8px;font-size:10px;font-weight:700;color:#1a1e24;">' +
      '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + tr.dot + ';margin-right:5px;vertical-align:middle;"></span>' + tr.label + '</td>' +
      '<td colspan="' + gCols.length + '" style="background:#fff8f4;border:1px solid #dde0e3;"></td></tr>';

    tlist.forEach((t, ri) => {
      const rowBg = ri%2===0 ? '#ffffff' : '#f7f8f9';
      let barCells = '';
      gCols.forEach(d => {
        if(t.milestone){
          if(d !== t.startDate){ barCells += '<td style="border:1px solid #dde0e3;background:' + rowBg + ';height:20px;"></td>'; return; }
          barCells += '<td style="border:1px solid #dde0e3;background:' + rowBg + ';text-align:center;padding:2px 0;">' +
            '<span class="msDiamond" title="Milestone: ' + escapeHtml(t.name) + '"></span></td>';
          return;
        }
        const inBar = d >= t.startDate && d <= t.endDate;
        if(!inBar){ barCells += '<td style="border:1px solid #dde0e3;background:' + rowBg + ';height:20px;"></td>'; return; }
        const isS = d===t.startDate, isE = d===t.endDate;
        const r = isS&&isE ? '3px' : isS ? '3px 0 0 3px' : isE ? '0 3px 3px 0' : '0';
        const pct = t.pct||0;
        barCells += '<td style="border:1px solid #dde0e3;background:' + rowBg + ';padding:2px 0;">' +
          '<div style="height:16px;background:' + tr.dot + ';border-radius:' + r + ';position:relative;overflow:hidden;opacity:.85;">' +
          '<div style="position:absolute;left:0;top:0;bottom:0;width:' + pct + '%;background:rgba(255,255,255,.3);"></div></div></td>';
      });
      body += '<tr style="background:' + rowBg + ';">' +
        '<td class="stickyName" style="width:170px;background:' + rowBg + ';border:1px solid #dde0e3;padding:3px 8px;font-size:10px;color:#1a1e24;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escapeHtml(t.name) + (t.zone?' ('+escapeHtml(t.zone)+')':'') + '">' +
        (t.milestone ? '<span class="msDiamond" style="margin-right:5px;vertical-align:middle;"></span>' : '') +
        escapeHtml(t.name) + (t.zone?' <span style="color:#8a9099;">('+escapeHtml(t.zone)+')</span>':'') + '</td>' +
        '<td class="stickyPct" style="width:40px;background:' + rowBg + ';border:1px solid #dde0e3;padding:3px 4px;font-size:9px;color:#5a6270;text-align:center;">' + (t.milestone ? '—' : (t.pct||0) + '%') + '</td>' +
        barCells + '</tr>';
    });
  });

  // ── Mobile card list — same filtered/grouped data, stacked layout ──
  let mobileHtml = '';
  trades.forEach(tr => {
    const tlist = filtered.filter(t => t.trade === tr.id).sort((a,b) => (a.startDate||'').localeCompare(b.startDate||''));
    mobileHtml += '<div class="mGroupHdr"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + tr.dot + ';"></span>' + tr.label + '</div>';
    tlist.forEach(t => {
      const pct = t.pct||0;
      if(t.milestone){
        mobileHtml += '<div class="mCard"><div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:#F96302;"></div>' +
          '<div class="mName"><span class="msDiamond" style="margin-right:6px;vertical-align:middle;"></span>' + escapeHtml(t.name) + '</div>' +
          '<div class="mMeta"><span>Milestone — ' + t.startDate + '</span></div>' +
          '</div>';
        return;
      }
      mobileHtml += '<div class="mCard"><div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:' + tr.dot + ';"></div>' +
        '<div class="mName">' + escapeHtml(t.name) + (t.zone?' <span class="mZone">(' + escapeHtml(t.zone) + ')</span>':'') + '</div>' +
        '<div class="mMeta"><span>' + t.startDate + ' → ' + t.endDate + '</span><span class="mPctNum" style="color:' + tr.dot + ';">' + pct + '%</span></div>' +
        '<div class="mPctBar"><div class="mPctFill" style="width:' + pct + '%;background:' + tr.dot + ';"></div></div>' +
        '</div>';
    });
  });

  wrap.innerHTML = '<table class="ga"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
  const mWrap = document.getElementById('mobileListWrap');
  if(mWrap) mWrap.innerHTML = mobileHtml;
}

// Produces a like-for-like PDF of the Bridge lookahead export — same
// letterhead conventions (project, date range, issued date, doc ref) —
// deliberately WITHOUT the Subcontractor Commitment & Sign-Off section,
// since there's no one to physically sign this on an external view-only
// link. Forces the Gantt table layout regardless of the current
// desktop/phone toggle, since that's the actual lookahead format.
function downloadLookaheadPDF(){
  if(!DATA) return;
  const allTasks = allTasksForRange();
  if(!allTasks.length){ return; }
  const starts = allTasks.map(t => t.startDate).sort();
  const ends = allTasks.map(t => t.endDate).sort();
  const rangeStart = starts[0], rangeEnd = ends[ends.length-1];
  const today = isoK(new Date());
  const docRef = 'LA-' + today.replace(/-/g,'').slice(2) + '-V01';

  const lh = document.getElementById('printLetterhead');
  lh.innerHTML =
    '<div class="plTitle">' + escapeHtml(DATA.name||'Project') + '</div>' +
    '<div class="plSub">Programme Lookahead — Whole Project · ' + rangeStart + ' to ' + rangeEnd + '</div>' +
    '<div class="plMeta"><span>Issued ' + today + ' · ' + docRef + '</span><span>Generated by Bridge · View-Only Portal</span></div>';

  const realTitle = document.title;
  document.title = (DATA.name||'Project') + '- ' + rangeStart + ' to ' + rangeEnd;
  window.print();
  document.title = realTitle;
}

function downloadCSV(){
  if(!DATA) return;
  const tasks = currentFilteredTasks().slice().sort((a,b) => (a.startDate||'').localeCompare(b.startDate||''));
  const hdr = ['Task','Trade','Zone','Start','Finish','% Complete','Milestone'];
  const rows = tasks.map(t => [t.name, tradeById(t.trade).label, t.zone||'', t.startDate, t.endDate, t.milestone?'':(t.pct||0), t.milestone?'Yes':'']);
  const csv = [hdr, ...rows].map(r => r.map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (DATA.name||'project') + '- Lookahead.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

loadPortal();
setInterval(loadPortal, 3 * 60 * 1000); // auto-refresh every 3 minutes
